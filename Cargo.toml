[package]
name = "bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "tls-rustls","chrono",] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
async-trait = "0.1.92"
base64 = "0.22"
hex = "0.4"
bs58 = "0.5"
sha3 = "0.10"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", features = ["ring"] }
futures-util = "0.3"
redis = {
    version = "0.27",
    features = [
        "tokio-comp",
        "connection-manager",
        "tls-rustls",
        "tokio-rustls-comp"
    ]
}
chrono = { version = "0.4", features = ["serde"] }